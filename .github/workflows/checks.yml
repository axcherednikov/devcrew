name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.11'
      - run: python -X utf8 -B scripts/check_package.py
      - if: runner.os != 'Windows'
        run: make test
      - name: Check the Python launcher used by native hooks
        if: runner.os == 'Windows'
        run: py -3 -I -B -X utf8 -c "import sys; print(sys.executable, sys.version); sys.exit(sys.version_info < (3, 11))"
      - name: Verify native Windows hooks, file locks, process trees, and CLI workflows
        if: runner.os == 'Windows'
        env:
          PYTHONUTF8: '1'
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -B scripts/run_tests.py --jobs 1
          test_native_files test_windows_processes test_publish_inline test_localization
          test_capacity.EnvelopeCommands
          test_checkout_policy.CurrentCheckoutLifecycle.test_only_local_trunk_is_primary_and_can_resume
          test_devcrew.DevCrewCLITest.test_init_selects_template_language_and_preserves_existing_documents
