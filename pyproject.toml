[tool.ruff]
target-version = "py311"
line-length = 100
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B006", "B008"]

[tool.ruff.lint.per-file-ignores]
# Standalone hooks and tests locate the unpacked plugin before importing its modules.
"hooks/*.py" = ["E402"]
"tests/*.py" = ["E402"]
